name: Build Wheels (Windows + Linux amd64)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools

      # ---- Linux: 安装 Boost.Python ----
      - name: Install Boost.Python (Linux)
        if: runner.os == 'Linux'
        run: |
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          PY_VER_NODOT=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER (nodot: $PY_VER_NODOT)"

          sudo apt-get update
          sudo apt-get install -y libboost-dev libboost-python${PY_VER_NODOT}-dev libboost-thread-dev libboost-system-dev || true

          if ldconfig -p 2>/dev/null | grep -q "libboost_python"; then
            echo "System Boost.Python found!"
            ldconfig -p | grep libboost_python
          else
            echo "System boost_python not found, compiling from source..."
            cd /tmp
            BOOST_VER="1.84.0"
            BOOST_DIR="boost_${BOOST_VER//./_}"
            wget -q "https://sourceforge.net/projects/boost/files/boost/${BOOST_VER}/${BOOST_DIR}.tar.gz/download" -O boost.tar.gz
            tar xzf boost.tar.gz
            cd ${BOOST_DIR}
            ./bootstrap.sh --with-python=python3 --with-python-version=${PY_VER}
            sudo ./b2 --with-python --with-thread --with-system variant=release link=shared threading=multi -j$(nproc) install
            sudo ldconfig
          fi

          ldconfig -p | grep libboost_python || ls -la /usr/local/lib/libboost_python* 2>/dev/null

      # ---- Windows: MSVC + Boost.Python 编译 ----
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Boost build (Windows)
        if: runner.os == 'Windows'
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: C:\boost_install
          key: boost-1.84.0-python${{ matrix.python-version }}-userconfig-v2

      - name: Build Boost.Python from source (Windows)
        if: runner.os == 'Windows' && steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Building Boost.Python from source (b2)..."
          $BOOST_VER = "1.84.0"
          $BOOST_DIR = "boost_1_84_0"
          $PY_VER = "${{ matrix.python-version }}"

          $workDir = "$env:RUNNER_TEMP\boost_build"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          Set-Location $workDir

          # Download Boost source
          Write-Host "Downloading Boost $BOOST_VER..."
          Invoke-WebRequest -Uri "https://archives.boost.io/release/$BOOST_VER/source/$BOOST_DIR.tar.gz" -OutFile "boost.tar.gz"
          if ((Get-Item "boost.tar.gz").Length -lt 1MB) {
            Write-Error "Download failed - file too small"
            exit 1
          }

          Write-Host "Extracting..."
          tar xzf boost.tar.gz
          Set-Location $BOOST_DIR

          # Find cl.exe path from the VS environment
          $clPath = (Get-Command cl -ErrorAction SilentlyContinue).Source
          if (-not $clPath) {
            Write-Error "cl.exe not found in PATH!"
            exit 1
          }
          Write-Host "Using cl.exe: $clPath"

          # Create user-config.jam to explicitly tell b2 where cl.exe is
          # This avoids b2's broken auto-detection (which finds vc6)
          $userConfig = "using msvc : 14.3 : `"$clPath`" ;"
          Set-Content -Path "user-config.jam" -Value $userConfig
          Write-Host "user-config.jam: $userConfig"

          # Bootstrap
          Write-Host "Bootstrapping..."
          & cmd /c "bootstrap.bat msvc --with-python=python --with-python-version=$PY_VER"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Bootstrap failed!"
            exit 1
          }

          # Build and install - static link
          # --user-config forces b2 to use our cl.exe path
          Write-Host "Building..."
          & cmd /c "b2 --with-python --with-thread --with-system --with-chrono --user-config=user-config.jam toolset=msvc-14.3 variant=release link=static threading=multi runtime-link=static address-model=64 --prefix=C:\boost_install -j2 install"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "b2 build failed!"
            exit 1
          }

          Write-Host "Boost.Python built successfully!"

          # Verify
          Get-ChildItem "C:\boost_install\lib\*boost_python*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  lib: $_" }

      - name: Set Boost environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $boostRoot = "C:\boost_install"
          echo "BOOST_ROOT=$boostRoot" >> $env:GITHUB_ENV
          echo "BOOST_INCLUDE=$boostRoot\include\boost-1_84" >> $env:GITHUB_ENV
          echo "BOOST_LIB=$boostRoot\lib" >> $env:GITHUB_ENV

          if (Test-Path "$boostRoot\include\boost-1_84\boost") {
            Write-Host "Boost headers found"
          } else {
            Write-Host "Boost headers NOT found at $boostRoot\include\boost-1_84"
          }
          Get-ChildItem "$boostRoot\lib\*boost_python*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  lib: $_" }

      # ---- Build wheel ----
      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m build --wheel

      - name: Build wheel (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          CXX: cl
        run: |
          python -m build --wheel

      # ---- Validate ----
      - name: Validate Linux wheel exists
        if: runner.os == 'Linux'
        run: |
          ls -la dist
          test -n "$(ls dist/*.whl)"

      - name: Validate Windows wheel exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist
          if (-not (Get-ChildItem -Path dist -Filter *.whl)) {
            throw "No wheel generated in dist/"
          }

      # ---- Upload ----
      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vnpy_xtppro-windows-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vnpy_xtppro-ubuntu-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # ---- Python 单元测试（不需要真实 SDK / vnpy）----
  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install vnpy pytest

      - name: Run pure Python tests (bar_generator, unit, mock)
        run: |
          python -m pytest test/test_bar_generator.py test/test_unit.py test/test_mock.py -v --tb=short


  # ---- 真实行情集成测试（Linux x86-64 + 编译好的 wheel）----
  integration:
    name: Integration Test (real MD server)
    runs-on: ubuntu-latest
    needs: build  # 等 wheel 构建完
    # 只在 main/master 分支且非 PR 时跑，避免 PR 泄露密钥
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: vnpy_xtppro-ubuntu-X64-py${{ matrix.python-version }}
          path: dist

      - name: Install system dependencies (ta-lib + Boost)
        run: |
          # TA-Lib C 库 — 直接用官方 deb 包（比 source compile 快且稳）
          cd /tmp
          wget -q https://github.com/TA-Lib/ta-lib/releases/download/v0.6.4/ta-lib_0.6.4_amd64.deb
          sudo dpkg -i ta-lib_0.6.4_amd64.deb
          sudo ldconfig

          # Boost.Python (vnpy 依赖)
          PY_VER_NODOT=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          sudo apt-get update
          sudo apt-get install -y libboost-dev libboost-python${PY_VER_NODOT}-dev || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install vnpy ta-lib pytest pytest-timeout

      - name: Install vnpy_xtppro wheel
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Installing: $WHEEL"
          pip install "$WHEEL"

      - name: Verify installation
        run: |
          python -c "from vnpy_xtppro.gateway import XtpProGateway; print('✓ XtpProGateway imported')"
          python -c "from vnpy_xtppro.api.xtp_pro_md_api import XtpProMdApi; print('✓ XtpProMdApi imported')"

      - name: Run integration test (real XTP Pro MD server)
        env:
          XTP_PRO_TEST_USER: ${{ secrets.XTP_PRO_TEST_USER }}
          XTP_PRO_TEST_PASSWORD: ${{ secrets.XTP_PRO_TEST_PASSWORD }}
        run: |
          python -m pytest test/test_integration.py -v --tb=long -s --timeout=120
