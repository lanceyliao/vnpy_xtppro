name: Build Wheels (Windows + Linux amd64)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools

      # ---- Linux: 安装 Boost.Python ----
      - name: Install Boost.Python (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          PY_VER_NODOT=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER (nodot: $PY_VER_NODOT)"

          # 尝试安装系统 boost
          sudo apt-get install -y libboost-dev libboost-python${PY_VER_NODOT}-dev libboost-thread-dev libboost-system-dev || true

          # 检查 boost_python 是否可用
          if ! dpkg -l | grep -q "libboost-python${PY_VER_NODOT}"; then
            echo "System boost_python not found, compiling from source..."
            cd /tmp
            BOOST_VER="1.82.0"
            BOOST_DIR="boost_${BOOST_VER//./_}"
            wget -q "https://boostorg.jfrog.io/artifactory/main/release/${BOOST_VER}/source/${BOOST_DIR}.tar.gz"
            tar xzf ${BOOST_DIR}.tar.gz
            cd ${BOOST_DIR}
            ./bootstrap.sh --with-python=python3 --with-python-version=${PY_VER}
            sudo ./b2 --with-python --with-thread --with-system variant=release link=shared threading=multi -j$(nproc) install
            sudo ldconfig
          fi

          # 验证
          python3 -c "import boost; print('Boost.Python available')" 2>/dev/null || echo "Boost.Python will be linked at compile time"
          ls -la /usr/lib/x86_64-linux-gnu/libboost_python* 2>/dev/null || ls -la /usr/local/lib/libboost_python* 2>/dev/null

      # ---- Windows: 安装 Boost.Python ----
      - name: Install Boost.Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BOOST_VER = "1.82.0"
          $BOOST_DIR = "boost_$($BOOST_VER.Replace('.','_'))"
          $env:BOOST_ROOT = "C:\boost_$BOOST_DIR"

          if (-not (Test-Path $env:BOOST_ROOT)) {
            Write-Host "Downloading Boost $BOOST_VER..."
            Invoke-WebRequest -Uri "https://boostorg.jfrog.io/artifactory/main/release/$BOOST_VER/source/$BOOST_DIR.tar.gz" -OutFile "$env:TEMP\boost.tar.gz"
            tar xzf "$env:TEMP\boost.tar.gz" -C C:\
            cd "C:\$BOOST_DIR"
            .\bootstrap.bat --with-python
            .\b2 --with-python --with-thread --with-system variant=release link=shared threading=multi -j2 install
          }

          echo "BOOST_ROOT=$env:BOOST_ROOT" >> $env:GITHUB_ENV

      # ---- Linux: Build with meson ----
      - name: Install meson/ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y meson ninja-build

      - name: Build C++ bindings (Linux)
        if: runner.os == 'Linux'
        run: |
          cd vnpy_xtppro/api
          meson setup builddir --prefix=/usr/local
          ninja -C builddir
          sudo ninja -C builddir install

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m build --wheel

      # ---- Windows: Build ----
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build wheel (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          CXX: cl
        run: |
          python -m build --wheel

      # ---- Validate ----
      - name: Validate Linux wheel exists
        if: runner.os == 'Linux'
        run: |
          ls -la dist
          test -n "$(ls dist/*.whl)"

      - name: Validate Windows wheel exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist
          if (-not (Get-ChildItem -Path dist -Filter *.whl)) {
            throw "No wheel generated in dist/"
          }

      # ---- Upload ----
      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vnpy_xtppro-windows-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vnpy_xtppro-ubuntu-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # ---- Python 单元测试（不需要真实 SDK）----
  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install VeighNa and test deps
        run: |
          pip install veighna_studio pytest

      - name: Install package
        run: |
          pip install -e .

      - name: Run tests
        run: |
          python -m pytest test/ -v --tb=short --ignore=test/test_md_connect.py
