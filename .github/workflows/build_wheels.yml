name: Build Wheels (Windows + Linux amd64)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools

      # ---- Linux: 安装 Boost.Python ----
      - name: Install Boost.Python (Linux)
        if: runner.os == 'Linux'
        run: |
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          PY_VER_NODOT=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER (nodot: $PY_VER_NODOT)"

          sudo apt-get update
          sudo apt-get install -y libboost-dev libboost-python${PY_VER_NODOT}-dev libboost-thread-dev libboost-system-dev || true

          if ldconfig -p 2>/dev/null | grep -q "libboost_python"; then
            echo "System Boost.Python found!"
            ldconfig -p | grep libboost_python
          else
            echo "System boost_python not found, compiling from source..."
            cd /tmp
            BOOST_VER="1.84.0"
            BOOST_DIR="boost_${BOOST_VER//./_}"
            wget -q "https://sourceforge.net/projects/boost/files/boost/${BOOST_VER}/${BOOST_DIR}.tar.gz/download" -O boost.tar.gz
            tar xzf boost.tar.gz
            cd ${BOOST_DIR}
            ./bootstrap.sh --with-python=python3 --with-python-version=${PY_VER}
            sudo ./b2 --with-python --with-thread --with-system variant=release link=shared threading=multi -j$(nproc) install
            sudo ldconfig
          fi

          ldconfig -p | grep libboost_python || ls -la /usr/local/lib/libboost_python* 2>/dev/null

      # ---- Windows: MSVC + Boost.Python 编译 ----
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Boost build (Windows)
        if: runner.os == 'Windows'
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: C:\boost_install
          key: boost-1.84.0-python${{ matrix.python-version }}-cmake-v1

      - name: Build Boost.Python from source (Windows)
        if: runner.os == 'Windows' && steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Building Boost.Python via CMake..."
          $BOOST_VER = "1.84.0"
          $BOOST_DIR = "boost_1_84_0"
          $PY_VER = "${{ matrix.python-version }}"

          $workDir = "$env:RUNNER_TEMP\boost_build"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          Set-Location $workDir

          # Download Boost source
          Write-Host "Downloading Boost $BOOST_VER..."
          Invoke-WebRequest -Uri "https://archives.boost.io/release/$BOOST_VER/source/$BOOST_DIR.tar.gz" -OutFile "boost.tar.gz"
          if ((Get-Item "boost.tar.gz").Length -lt 1MB) {
            Write-Error "Download failed - file too small"
            exit 1
          }

          Write-Host "Extracting..."
          tar xzf boost.tar.gz
          Set-Location $BOOST_DIR

          # Get Python info
          $pyRoot = (python -c "import sys, sysconfig; print(sysconfig.get_config_var('installed_base'))").Trim()
          $pyInclude = (python -c "import sysconfig; print(sysconfig.get_path('include'))").Trim()
          $pyLibDir = (python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))").Trim()
          Write-Host "Python root: $pyRoot"
          Write-Host "Python include: $pyInclude"
          Write-Host "Python lib dir: $pyLibDir"

          # Configure with CMake
          $installDir = "C:\boost_install"
          cmake -B build `
            -DBOOST_INCLUDE_LIBRARIES="python;thread;system" `
            -DCMAKE_INSTALL_PREFIX="$installDir" `
            -DCMAKE_BUILD_TYPE=Release `
            -DPython_INCLUDE_DIR="$pyInclude" `
            -DPython_LIBRARY="$pyLibDir\python${PY_VER.Replace('.','')}.lib" `
            -DPython_EXECUTABLE="$(Get-Command python).Source" `
            -DBUILD_SHARED_LIBS=OFF

          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configure failed!"
            exit 1
          }

          # Build
          cmake --build build --config Release -j 2
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake build failed!"
            exit 1
          }

          # Install
          cmake --install build
          Write-Host "Boost.Python built successfully!"

          # Verify
          Get-ChildItem "$installDir\lib\*boost_python*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  lib: $_" }

      - name: Set Boost environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $boostRoot = "C:\boost_install"
          echo "BOOST_ROOT=$boostRoot" >> $env:GITHUB_ENV
          echo "BOOST_INCLUDE=$boostRoot\include" >> $env:GITHUB_ENV
          echo "BOOST_LIB=$boostRoot\lib" >> $env:GITHUB_ENV

          # CMake install puts headers in include/boost-1_84
          $boostInc = "$boostRoot\include"
          if (-not (Test-Path "$boostInc\boost")) {
            # Check versioned include dir
            $versionedInc = Get-ChildItem "$boostRoot\include" -Directory | Where-Object { $_.Name -match "boost-" } | Select-Object -First 1
            if ($versionedInc) {
              $boostInc = $versionedInc.FullName
              echo "BOOST_INCLUDE=$boostInc" >> $env:GITHUB_ENV
              Write-Host "Using versioned include dir: $boostInc"
            }
          }

          if (Test-Path "$boostInc\boost") {
            Write-Host "Boost headers found at $boostInc"
          } else {
            Write-Host "Boost headers NOT found at $boostInc"
          }
          Get-ChildItem "$boostRoot\lib\*boost_python*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  lib: $_" }

      # ---- Build wheel ----
      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m build --wheel

      - name: Build wheel (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
          CXX: cl
        run: |
          python -m build --wheel

      # ---- Validate ----
      - name: Validate Linux wheel exists
        if: runner.os == 'Linux'
        run: |
          ls -la dist
          test -n "$(ls dist/*.whl)"

      - name: Validate Windows wheel exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist
          if (-not (Get-ChildItem -Path dist -Filter *.whl)) {
            throw "No wheel generated in dist/"
          }

      # ---- Upload ----
      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vnpy_xtppro-windows-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vnpy_xtppro-ubuntu-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # ---- Python 单元测试（不需要真实 SDK / vnpy）----
  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install vnpy pytest

      - name: Run pure Python tests (bar_generator, unit, mock)
        run: |
          python -m pytest test/test_bar_generator.py test/test_unit.py test/test_mock.py -v --tb=short
